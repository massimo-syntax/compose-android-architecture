[versions]
agp = "9.4.0"
coilCompose = "2.7.0"
coreKtx = "1.19.0"
coreSplashscreen = "1.2.0"
hiltAndroid = "2.60.1"
hiltLifecycleViewmodelCompose = "1.4.0"
junit = "4.13.2"
